<!DOCTYPE html>
    <html>
    <head>
        <title>Very cool boxes abound</title>
        <link rel="stylesheet" href="style.css">
        <script>
            function updateTextArea() {
                setTimeout(function() {
                    var textArea = document.querySelector("#text-area-box__textarea");
                    textArea.value = "newemail@updated.com";
                }, 1000); // 1-second delay (1000 milliseconds)
            }
        </script>
    </head>
    <body>
        <h1>Wow look at my cool boxes!</h1>
        <div id="container">
            <div id="nice-box" class="box">
                This is a very nice box
            </div>
            <div id="less-nice-box" class="box">
                This is a less nice box tbh
            </div>
            <div id="text-area-box" class="box">
                <p>This box has text from a database in it</p>
                <textarea id="text-area-box__textarea">thisemail@fake.com</textarea>
                <button onclick="updateTextArea()">Update Text</button>
        </div>
        </div>
    </body>
</html>
